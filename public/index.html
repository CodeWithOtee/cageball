<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cage Ball</title>
<meta name="description" content="Cage Ball: 3v3 street football in your browser. Two minutes. Most goals wins.">
<meta name="theme-color" content="#10141d">
<meta property="og:title" content="Cage Ball">
<meta property="og:description" content="3v3 street football in your browser. Two minutes. Most goals wins.">
<meta property="og:url" content="https://cageball.app">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161b27;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{
  height:100%;margin:0;background:var(--bg);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;overscroll-behavior:none;
}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;}
#nick{position:fixed;z-index:5;box-sizing:border-box;margin:0;padding:0 14px;border:2px solid #ffc83d;border-radius:12px;
  background:#0f1320;color:#ffc83d;font:400 17px "Bowlby One",Impact,sans-serif;text-align:center;text-transform:uppercase;
  -webkit-user-select:text;user-select:text;outline:none;}
#nick[hidden]{display:none;}
#pv{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:16px;box-sizing:border-box;background:rgba(10,12,18,.96);color:#efe9da;
  font:800 17px "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:manipulation;}
#pv[hidden]{display:none;}
#pv img{max-width:92vw;max-height:70vh;border-radius:10px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;}
#pv img[hidden]{display:none;}
#lnk{width:88vw;max-width:420px;box-sizing:border-box;padding:12px;border-radius:10px;border:2px solid #ffc83d;background:#0f1320;color:#efe9da;font:600 15px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
#lnk[hidden]{display:none;}
#pv button{font:400 18px "Bowlby One",Impact,sans-serif;color:#161b27;background:#ffc83d;border:0;border-radius:12px;padding:12px 28px;}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Cage Ball street football game"></canvas>
<input id="nick" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your name" hidden>
<div id="pv" hidden>
  <div id="pvmsg">Press and hold the card to save it, then post it.</div>
  <img id="pvimg" alt="Your Cage Ball score card">
  <input id="lnk" readonly hidden aria-label="Challenge link">
  <button id="pvx" type="button">Close</button>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

/* ---------- constants ---------- */
const W = 360, H = 540, M = 18, GW = 84, PR = 11, BR = 6;
const C = {
  bg:'#161b27', fence:'#222a3a', hatch:'#3a4559',
  court:'#35607a', court2:'#386580', chalk:'#efe9da',
  me:'#ffc83d', cpu:'#ee4266', ink:'#1b1f2b', ball:'#f7f4ec'
};
const DISPLAY = '"Bowlby One", Impact, "Arial Black", sans-serif';
const BODY = '"Barlow Condensed", "Arial Narrow", system-ui, sans-serif';

/* ---------- tiers + progress ---------- */
const TIERS=[
  {name:'ROOKIE',   desc:'Slow defenders. Learn the moves.',      spd:0.93,tackle:0.34,guard:1.05,shot:0.75,range:150,spread:0.95,bait:0.2,save:0.55,smart:false},
  {name:'HUSTLER',  desc:'Quick, physical, and they shoot first.', spd:0.96,tackle:0.38,guard:1.1, shot:0.45,range:175,spread:0.7, bait:0.4,save:0.55,smart:false},
  {name:'CAGE KING',desc:'They read your dodge. Beat them to climb.',spd:1.03,tackle:0.5, guard:1.22,shot:0.3, range:190,spread:0.5, bait:0.55,save:0.7,smart:true}
];
const TEAM0={spd:0.97,tackle:0.38,guard:1.1,shot:0.4,range:175,spread:0.7,bait:0.4,smart:false};
let T=TIERS[0];
const GAME_URL='https://cageball.app';
const prog={seen:0,tut:0,snd:1,guide:1,lw:null,dev:'',unlocked:0,streak:0,best:0,nick:'',played:0,wins:0,goals:0,nut:0,margin:0};
try{ const d=JSON.parse(localStorage.getItem('cageball.v1')||'null'); if(d){
  prog.seen=d.seen|0;prog.tut=d.tut|0;prog.snd=('snd' in d)?(d.snd?1:0):1;prog.guide=('guide' in d)?(d.guide?1:0):1;
  if(d.lw&&typeof d.lw==='object'){ const lt=d.lw.t|0, la=d.lw.a|0, lb=d.lw.b|0; if(lt>=0&&lt<3&&la>lb) prog.lw={t:lt,a:la,b:lb}; }prog.dev=(typeof d.dev==='string'&&/^[0-9a-f-]{36}$/i.test(d.dev))?d.dev:'';prog.unlocked=Math.min(2,d.unlocked|0);prog.streak=d.streak|0;prog.best=d.best|0;
  prog.nick=typeof d.nick==='string'?d.nick.slice(0,12):'';
  prog.played=d.played|0;prog.wins=d.wins|0;prog.goals=d.goals|0;prog.nut=d.nut|0;prog.margin=d.margin|0;
} }catch(e){}
function save(){ try{localStorage.setItem('cageball.v1',JSON.stringify(prog));}catch(e){} }
function uuid(){
  try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  const b=new Uint8Array(16);
  try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<16;i++) b[i]=Math.floor(Math.random()*256); }
  b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
if(!prog.dev){ prog.dev=uuid(); save(); }
function prm(p){ return p.team===1?T:TEAM0; }
function myTeam(){ return net.on&&net.role==='guest'?1:0; }
function curOf(team){ return team===0?cur:cur1; }

/* ---------- layout ---------- */
let vw=0, vh=0, dpr=1, sc=1, ox=0, oy=0, HUD=46, CH=190;
const UI = {shoot:{x:0,y:0,r:40}, pass:{x:0,y:0,r:30}, trick:{x:0,y:0,r:30}};
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  vw = cv.clientWidth; vh = cv.clientHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  CH = Math.min(200, vh*0.26);
  const r = Math.max(26,Math.min(36, CH*0.19)), R = r*1.3;
  const sx = vw - R - 14, sy = vh - Math.max(R+10, CH*0.36);
  UI.shoot = {x:sx, y:sy, r:R};
  const D=R+r+16, rad=a=>a*Math.PI/180;
  UI.pass  = {x:sx+Math.cos(rad(172))*D, y:sy+Math.sin(rad(172))*D, r:r};
  UI.trick = {x:sx+Math.cos(rad(242))*D, y:sy+Math.sin(rad(242))*D, r:r};
  /* the pitch uses all the height unless a button would sit on top of it (then it stops above the buttons) */
  const topBtn = Math.min(UI.shoot.y-UI.shoot.r, UI.pass.y-UI.pass.r, UI.trick.y-UI.trick.r);
  const fit=availH=>{
    sc = Math.min(vw/(W+2*M), availH/(H+2*M));
    ox = (vw - W*sc)/2;
    oy = HUD + (availH - H*sc)/2;
  };
  fit(vh - HUD - 8);
  const hits=[UI.shoot,UI.pass,UI.trick].some(c=>c.x+c.r+4>ox&&c.x-c.r-4<ox+W*sc&&c.y+c.r+4>oy&&c.y-c.r-4<oy+H*sc);
  if(hits) fit(Math.max(vh*0.5, topBtn - HUD + 14));
}
window.addEventListener('resize', resize);
try{ if(window.ResizeObserver) new ResizeObserver(()=>{ if(cv.clientWidth!==vw||cv.clientHeight!==vh) resize(); }).observe(cv); }catch(e){}
try{ if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{ if(cv.clientWidth!==vw||cv.clientHeight!==vh) resize(); }); }catch(e){}

/* ---------- audio ---------- */
let ac = null;
function audioOn(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function sfx(f, d=0.08, type='square', v=0.04){
  if(!ac||!prog.snd) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=v;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d); o.stop(ac.currentTime+d);
  }catch(e){}
}

/* ---------- state ---------- */
const st = {mode:'menu', t:120, score:[0,0], msg:'', msgC:'#fff', msgT:0, msgBig:false,
            freeze:0, hold:0, kick:0, charge:0, sw:0, menuT:0,
            meter:[0,0], fire:[0,0], shake:0, stop:0, tier:0, unlockMsg:'', toastT:0, toast:'', last:null, stats:{nut:0,fire:0}, kickProt:0, gk:[null,null], charge1:0, sw1:0, onlRes:null};
let players=[], ball=null, cur=null, cur1=null;
const inp = {shootHeld:false, joy:null, keys:{}};
const net={}; netReset();

function pop(text, color='#fff', dur=1.1, big=false){ st.msg=text; st.msgC=color; st.msgT=dur; st.msgBig=big; }

function resetKick(kickTeam){
  const mk=(team,id,x,y)=>({team,id,x,y,vx:0,vy:0,fx:0,fy:team===0?-1:1,
    stun:0,cd:0,tcd:0,dash:0,inv:0,lunge:0,tr:0,aiT:Math.random()*0.5});
  players = [
    mk(0,0,W/2,H*0.57), mk(0,1,W*0.24,H*0.72), mk(0,2,W*0.76,H*0.72),
    mk(1,0,W/2,H*0.43), mk(1,1,W*0.24,H*0.28), mk(1,2,W*0.76,H*0.28)
  ];
  const kicker = players[kickTeam===0?0:3];
  ball = {x:W/2,y:H/2,vx:0,vy:0,owner:kicker,rot:0,last:kickTeam,hot:false};
  cur = players[0]; cur1 = players[3]; st.charge1=0; st.sw1=0;
  st.freeze=0; st.hold=0.9; st.charge=0; st.kickProt=1.6; st.gk=[null,null];
  pop('KICK OFF','#fff',0.9); evt('k',0);
}
function startGame(i,chal){
  st.tier=i|0; T=Object.assign({},TIERS[st.tier]); st.unlockMsg=''; st.chalActive=chal||null; st.tut=null; st.onlRes=null;
  /* gentler ROOKIE until the first win (never in a friend challenge) */
  if(st.tier===0&&!chal&&prog.wins===0&&prog.played<6){ T.spd=0.78; T.tackle=0.16; T.guard=0.95; T.save=0.4; T.shot=1.2; T.spread=1.15; T.bait=0.1; }
  st.mode='play'; st.t=120; st.score=[0,0]; st.kick=0; st.meter=[0,0]; st.fire=[0,0]; st.shake=0; st.stop=0; st.stats={nut:0,fire:0};
  resetKick(0);
  track('match_start',st.tier); if(prog.played===0) track('first_match_start',st.tier); else if(prog.played===1) track('second_match_start',st.tier);
}
function endGame(){
  if(net.on&&net.role==='host'){ onlineEnd(); return; }
  st.mode='over'; st.menuT=0; st.unlockMsg='';
  const a=st.score[0], b=st.score[1];
  if(a>b){
    prog.streak++; prog.best=Math.max(prog.best,prog.streak); prog.lw={t:st.tier,a,b};
    if(st.tier<TIERS.length-1&&prog.unlocked<st.tier+1){ prog.unlocked=st.tier+1; st.unlockMsg='UNLOCKED: '+TIERS[prog.unlocked].name; }
    else if(st.tier===TIERS.length-1) st.unlockMsg='YOU BEAT THE KING';
  } else prog.streak=0;
  prog.played++; prog.goals+=a; prog.nut+=st.stats.nut;
  if(a>b){ prog.wins++; prog.margin=Math.max(prog.margin,a-b); }
  let chal=null;
  if(st.chalActive){ const c=st.chalActive, mine=a-b, theirs=c.gf-c.ga; chal={nick:c.nick,gf:c.gf,ga:c.ga,res:mine>theirs?'beat':mine===theirs?'tied':'lost'}; st.chalActive=null; }
  st.last={a,b,tier:T.name,tierIdx:st.tier,streak:prog.streak,nut:st.stats.nut,fire:st.stats.fire,res:a>b?'win':a<b?'loss':'draw',chal,code:'',codeP:null};
  save();
  queueResult(a,b,st.tier,st.stats.nut,prog.streak);
  track('match_end',st.tier,a); if(prog.played===1){ track('first_match_end',st.tier,a-b); } if(a>b&&prog.wins===1) track('first_win',st.tier,a-b);
  sfx(300,0.4,'sawtooth',0.05);
}

/* ---------- splash + tutorial ---------- */
function afterSplash(){
  if(joinCode&&onlineOn()){ const jc=joinCode; joinCode=''; startJoin(jc); return; }
  if(!prog.tut){ startTut(true); }
  else { st.mode=st.chal?'chal':'menu'; st.menuT=0; }
}
function startTut(auto){
  if(auto) track('tut_start');
  st.tut={step:0,ring:{x:W*0.4,y:H*0.55},tgt:null,auto:!!auto};
  st.tier=0; T=Object.assign({},TIERS[0]); st.chalActive=null;
  st.mode='play'; st.t=120; st.score=[0,0]; st.kick=0; st.meter=[0,0]; st.fire=[0,0]; st.shake=0; st.stop=0; st.stats={nut:0,fire:0};
  resetKick(0);
  players=players.filter(p=>p.team===0&&p.id<2);
  const a=players[0], b=players[1];
  a.x=W/2; a.y=H*0.82; b.x=W*0.55; b.y=H*0.22; b.fx=0; b.fy=-1;
  st.tut.tgt=b; ball.owner=a; cur=a; st.hold=0.35; st.msgT=0; st.gk=[null,null];
}
function tutReset(){
  const tu=st.tut, b=tu.tgt;
  b.x=W*0.55; b.y=H*0.22; b.vx=b.vy=0; b.fx=0; b.fy=-1; b.cd=0;
  ball.owner=b; ball.vx=ball.vy=0; cur=b; tu.step=2; st.charge=0;
  pop('TRY AGAIN','#fff',0.9);
}
function tutProgress(){
  const tu=st.tut;
  if(tu.step===0){
    if(Math.hypot(cur.x-tu.ring.x,cur.y-tu.ring.y)<20){ tu.step=1; pop('NICE','#ffc83d',0.8); sfx(660,0.12,'triangle',0.06); }
  } else if(tu.step===1){
    if(cur===tu.tgt&&ball.owner===cur){ tu.step=2; pop('NICE','#ffc83d',0.8); sfx(660,0.12,'triangle',0.06); }
    else if(!ball.owner&&Math.hypot(ball.vx,ball.vy)<35) tutReset();
  } else if(tu.step===2){
    if(!ball.owner&&Math.hypot(ball.vx,ball.vy)<35) tutReset();
  }
}
function finishTut(skipped){
  const auto=st.tut&&st.tut.auto; st.tut=null; if(auto){ prog.tut=1; save(); track(skipped?'tut_skip':'tut_done'); }
  resetKick(0); st.hold=0; st.msgT=0; st.freeze=0; st.score=[0,0]; st.charge=0;
  inp.shootHeld=false; inp.joy=null; ptr.clear();
  st.mode=st.chal?'chal':'menu'; st.menuT=0;
  if(!skipped) toast("YOU'RE READY. PLAY ROOKIE.");
}
function tutSkip(){ return {x:vw-78,y:8,w:66,h:28}; }

function addMeter(team,v){
  if(st.fire[team]>0) return;
  st.meter[team]=Math.min(1,st.meter[team]+v);
  if(st.meter[team]>=1){
    st.meter[team]=0; st.fire[team]=5; st.shake=7; if(team===0) st.stats.fire++;
    pop(team===0?'ON FIRE!':(net.on?'OPP ON FIRE':'CPU ON FIRE'),team===0?C.me:C.cpu,1.3,true); evt('f',team);
    sfx(300,0.1,'sawtooth',0.06); setTimeout(()=>sfx(600,0.2,'sawtooth',0.06),90);
  }
}

/* ---------- actions ---------- */
function shoot(p, power){
  if(ball.owner!==p) return;
  let dx=p.fx, dy=p.fy;
  const gy=p.team===0?0:H;
  let ax=W/2-p.x, ay=gy-p.y; const al=Math.hypot(ax,ay)||1; ax/=al; ay/=al;
  if(dx*ax+dy*ay>0.75){
    dx=dx*0.75+ax*0.25; dy=dy*0.75+ay*0.25;
    const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
  }
  const ownHalf=p.team===0?p.y>H*0.5:p.y<H*0.5;
  const gdist=Math.hypot(W/2-p.x,gy-p.y);
  if(ownHalf) power=Math.min(power,0.3);
  else if(gdist>140) power=Math.min(power,0.5);
  const onFire=st.fire[p.team]>0&&!ownHalf;
  const sp=(300+power*360)*(onFire?1.18:1);
  ball.owner=null; ball.vx=dx*sp; ball.vy=dy*sp; ball.hot=onFire;
  ball.x=p.x+dx*(PR+BR+2); ball.y=p.y+dy*(PR+BR+2);
  p.cd=0.3; ball.last=p.team;
  const up=p.team===0;
  if(!st.tut&&(up?dy<-0.2:dy>0.2)&&gdist<150&&(net.on||up)){
    const g=st.gk[up?1:0];
    if(g&&g.lunge<=0){
      const tt=(up?ball.y:H-ball.y)/(Math.abs(dy)*sp), xAt=ball.x+dx*sp*tt;
      const sv=net.on?0.5:(T.save||0.4);
      if(Math.abs(xAt-W/2)<GW/2+6&&Math.random()<sv*(onFire?0.6:1)){
        const sx=xAt-g.x; if(Math.abs(sx)>6){ g.fx=Math.sign(sx); g.fy=0; g.lunge=0.3; g.tr=1.0; }
      }
    }
  }
  if(onFire||power>0.8){ st.stop=0.05; st.shake=Math.max(st.shake,onFire?6:3); }
  sfx(120+power*120,0.1,'square',0.06);
}
function passTo(p, t){
  const d0=Math.hypot(t.x-p.x,t.y-p.y), T0=0.26+d0*0.0009;
  const tx=Math.max(PR,Math.min(W-PR,t.x+t.vx*T0*0.8)), ty=Math.max(PR,Math.min(H-PR,t.y+t.vy*T0*0.8));
  let dx=tx-p.x, dy=ty-p.y; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
  /* the ball slows by e^-1.08t, so pick the launch speed that covers d in about T0 seconds */
  const sp=Math.max(240,Math.min(700,d*1.08/(1-Math.exp(-1.08*T0))));
  ball.owner=null; ball.vx=dx*sp; ball.vy=dy*sp;
  ball.x=p.x+dx*(PR+BR+2); ball.y=p.y+dy*(PR+BR+2);
  p.cd=0.28; p.fx=dx; p.fy=dy; ball.last=p.team; ball.hot=false;
  if(p.team===0){ cur=t; st.sw=0.6; }
  else if(net.on&&net.role==='host'&&p===cur1){ cur1=t; st.sw1=0.6; }
  sfx(260,0.06,'triangle',0.06);
}
/* who a PASS would go to right now: mostly the teammate you are facing, ties broken toward the one nearest to being open */
function passTarget(team){
  team=team|0;
  if(st.tut) return st.tut.tgt;
  const c=curOf(team); if(!c) return null;
  let best=null,bs=-1e9;
  for(const t of players){
    if(t.team!==team||t===c) continue;
    const dx=t.x-c.x, dy=t.y-c.y, d=Math.hypot(dx,dy)||1;
    let od=70;
    for(const q of players) if(q.team!==team) od=Math.min(od,Math.hypot(q.x-t.x,q.y-t.y));
    const sc_=((dx*c.fx+dy*c.fy)/d)*100 + od*0.6 - d*0.08;
    if(sc_>bs){bs=sc_;best=t;}
  }
  return best;
}
function doPassT(team){
  if(st.mode!=='play'||st.hold>0||st.freeze>0) return;
  const c=curOf(team); if(!c) return;
  if(ball.owner===c){
    const best=passTarget(team);
    if(best) passTo(c,best);
  } else {
    let best=null,bd=1e9;
    for(const t of players){
      if(t.team!==team||t===c) continue;
      const d=Math.hypot(t.x-ball.x,t.y-ball.y);
      if(d<bd){bd=d;best=t;}
    }
    if(best){ if(team===0){cur=best; st.sw=0.5;} else {cur1=best; st.sw1=0.5;} sfx(520,0.04,'triangle',0.04); }
  }
}
function doPass(){
  if(net.on&&net.role==='guest'){ if(st.mode==='play'){ net.in.pc++; netSendInput(true); } return; }
  if(st.mode!=='play'||st.hold>0||st.freeze>0) return;
  if(st.tut){ if(st.tut.step===1&&ball.owner===cur) passTo(cur,st.tut.tgt); return; }
  doPassT(0);
}
function doTrickT(team){
  if(st.mode!=='play'||st.hold>0||st.freeze>0) return;
  const c=curOf(team); if(!c||c.tr>0) return;
  c.tr=0.9;
  if(ball.owner===c){ c.dash=0.5; c.inv=0.55; sfx(420,0.12,'sawtooth',0.04); }
  else { c.lunge=0.32; if(net.on) c.tr=1.5; sfx(160,0.12,'sawtooth',0.04); }
}
function doTrick(){
  if(net.on&&net.role==='guest'){ if(st.mode==='play'){ net.in.tc++; netSendInput(true); } return; }
  if(st.tut) return;
  doTrickT(0);
}
function releaseShootT(team){

  if(st.mode==='play'&&st.hold<=0&&st.freeze<=0&&c&&ball.owner===c) shoot(c,Math.max(0.25,ch));

/* ---------- movement + collisions ---------- */
function move(p, dt, dx, dy, mul){
  let sp=114*mul*(st.fire[p.team]>0?1.12:1);
  if(ball.owner===p) sp*=0.92;
  const burst = p.dash>0 || p.lunge>0;
  if(p.dash>0){ sp=235; if(!dx&&!dy){dx=p.fx;dy=p.fy;} }
  if(p.lunge>0){ sp=250; dx=p.fx; dy=p.fy; }
  if(p.stun>0) sp=0;
  const k=Math.min(1,dt*(burst?18:9));
  p.vx+=(dx*sp-p.vx)*k; p.vy+=(dy*sp-p.vy)*k;
  const m=Math.hypot(dx,dy);
  if(m>0.15&&p.lunge<=0&&p.stun<=0){ p.fx=dx/m; p.fy=dy/m; }
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  p.x=Math.max(PR,Math.min(W-PR,p.x));
  const yl=ball.owner===p?20:PR;
  p.y=Math.max(yl,Math.min(H-yl,p.y));
}
function seek(p,dt,tx,ty,mul,stop=5){
  const dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy);
  if(d<stop){ move(p,dt,0,0,mul); return; }
  const k=Math.min(1,d/22);
  move(p,dt,dx/d*k,dy/d*k,mul);
}
function separate(){
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    const a=players[i], b=players[j];
    let dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy)||0.01, min=PR*2-2;
    if(d<min){
      const push=(min-d)/2; dx/=d; dy/=d;
      a.x-=dx*push; a.y-=dy*push; b.x+=dx*push; b.y+=dy*push;
    }
  }
}
function steal(q,o){
  ball.owner=q; ball.last=q.team; ball.hot=false; o.cd=0.6; o.stun=0.35; q.stun=0; addMeter(q.team,0.1);
  if(q.team===0){ cur=q; pop('WON IT','#ffc83d',0.7); }
  else if(net.on&&net.role==='host') cur1=q;
  evt('w',q.team);
  sfx(200,0.08,'square',0.06);
}
function tryTackle(){
  const o=ball.owner; if(!o||st.kickProt>0) return;
  for(const q of players){
    if(q.team===o.team||q.stun>0||q.tcd>0) continue;
    const d=Math.hypot(q.x-o.x,q.y-o.y);
    const reach=q.lunge>0?PR*2+10:PR*2+2;
    if(d<reach){
      if(o.inv>0&&q.team===1&&T.smart) continue;
      q.tcd=0.8;
      if(o.inv>0) continue;
      if(Math.random()<(q.lunge>0?(net.on?0.6:0.9):(q.team===1?T.tackle:0.38))) steal(q,o); else q.stun=0.25;
      break;
    }
  }
}
function goal(team){
  if(st.tut&&team===1){ tutReset(); return; }
  if(team===0&&!st.tut&&!net.on&&prog.played===0&&!st.firstGoalSent){ st.firstGoalSent=1; track('first_goal',st.tier,Math.round(120-st.t)); }
  st.score[team]++; st.freeze=1.9; st.shake=12; st.fire[0]=0; st.fire[1]=0; st.kick=1-team; st.charge=0; st.charge1=0; evt('g',team);
  pop(team===0?'GOAL!':'THEY SCORED', team===0?C.me:C.cpu, 1.8, true);
  sfx(520,0.15,'square',0.06); setTimeout(()=>sfx(660,0.15,'square',0.06),140); setTimeout(()=>sfx(880,0.3,'square',0.06),280);
}
function ballStep(dt, goalsOn){
  if(ball.owner){
    const o=ball.owner;
    ball.x=o.x+o.fx*(PR+BR-1); ball.y=o.y+o.fy*(PR+BR-1);
    ball.vx=o.vx; ball.vy=o.vy;
    ball.rot+=Math.hypot(o.vx,o.vy)*dt*0.12;
    return;
  }
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  const f=Math.pow(0.34,dt); ball.vx*=f; ball.vy*=f;
  ball.rot+=Math.hypot(ball.vx,ball.vy)*dt*0.1;
  if(ball.x<BR){ball.x=BR;ball.vx=Math.abs(ball.vx)*0.8;}
  if(ball.x>W-BR){ball.x=W-BR;ball.vx=-Math.abs(ball.vx)*0.8;}
  const inMouth=Math.abs(ball.x-W/2)<GW/2-BR*0.5;
  if(goalsOn&&inMouth){
    if(ball.y<0){goal(0);return;}
    if(ball.y>H){goal(1);return;}
  }
  const top=inMouth?-M+BR:BR, bot=inMouth?H+M-BR:H-BR, bounce=inMouth?0.2:0.8;
  if(ball.y<top){ball.y=top;ball.vy=Math.abs(ball.vy)*bounce;}
  if(ball.y>bot){ball.y=bot;ball.vy=-Math.abs(ball.vy)*bounce;}
}

/* ---------- AI ---------- */
function aiPass(p){
  let best=null,bs=-1e9;
  for(const t of players){
    if(t.team!==p.team||t===p) continue;
    const adv=p.team===0?p.y-t.y:t.y-p.y;
    const d=Math.hypot(t.x-p.x,t.y-p.y);
    let od=1e9;
    for(const q of players) if(q.team!==p.team) od=Math.min(od,Math.hypot(q.x-t.x,q.y-t.y));
    const s=adv*0.5+Math.min(od,80)*1.2-d*0.2;
    if(s>bs){bs=s;best=t;}
  }
  if(best) passTo(p,best);
}
function ai(p,dt,chaser,mul){
  const guard=p.isGuard, pr=prm(p);
  p.aiT+=dt;
  const goalY=p.team===0?0:H, ownY=p.team===0?H:0, atk=p.team===0?-1:1;
  const o=ball.owner;
  if(o===p){
    if(p.pass>0){ p.pass-=dt; if(p.pass<=0) aiPass(p); return; }
    const dg=Math.hypot(W/2-p.x,goalY-p.y);
    let near=null,nd=1e9;
    for(const q of players){
      if(q.team===p.team) continue;
      const d=Math.hypot(q.x-p.x,q.y-p.y);
      if(d<nd){nd=d;near=q;}
    }
    if(dg<pr.range&&p.aiT>pr.shot){
      const tx=W/2+(Math.random()-0.5)*GW*pr.spread;
      const ax=tx-p.x, ay=goalY-p.y, l=Math.hypot(ax,ay)||1;
      p.fx=ax/l; p.fy=ay/l;
      shoot(p,0.55+Math.random()*0.45); p.aiT=0; return;
    }
    if(nd<42&&p.aiT>0.8){
      if(Math.random()<pr.bait&&p.tr<=0){ p.tr=1.2; p.dash=0.45; p.inv=0.5; p.aiT=0.4; }
      else { aiPass(p); p.aiT=0; return; }
    }
    let dx=W/2-p.x, dy=goalY-p.y; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    if(near&&nd<70){
      const ex=p.x-near.x, ey=p.y-near.y, el=Math.hypot(ex,ey)||1;
      dx+=ex/el*0.9; dy+=ey/el*0.4;
      const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    }
    move(p,dt,dx,dy,mul); return;
  }
  if(guard&&o&&o.team!==p.team&&Math.hypot(o.x-W/2,o.y-ownY)<78&&!st.tut){
    const dx=o.x-p.x, dy=o.y-p.y, d=Math.hypot(dx,dy)||1;
    if(d<34&&p.tr<=0&&p.lunge<=0&&Math.random()<dt*2.2*pr.guard){ p.fx=dx/d; p.fy=dy/d; p.tr=1.3; p.lunge=0.32; }
    seek(p,dt,o.x,o.y,pr.guard,3); return;
  }
  if(guard){
    const gx=Math.max(W/2-GW/2+8,Math.min(W/2+GW/2-8,ball.x));
    const depth=(o&&o.team===p.team)?62:30;
    seek(p,dt,gx,ownY+(p.team===0?-1:1)*depth,pr.guard,3); return;
  }
  const lane=p.id===1?0.22:p.id===2?0.78:0.5;
  if(o&&o.team===p.team){
    const tx=p.id===0?(o.x>W/2?W*0.3:W*0.7):W*lane;
    const ty=Math.max(34,Math.min(H-34,o.y+atk*85));
    seek(p,dt,tx,ty,mul); return;
  }
  if(p===chaser){
    if(o&&p.team===1&&T.smart&&o.tr<=0&&Math.hypot(o.x-p.x,o.y-p.y)<90){
      let ax=W/2-o.x, ay=ownY-o.y; const al=Math.hypot(ax,ay)||1; ax/=al; ay/=al;
      seek(p,dt,o.x+ax*34,o.y+ay*34,1.0,2); return;
    }
    const tx=o?o.x:ball.x+ball.vx*0.2, ty=o?o.y:ball.y+ball.vy*0.2;
    seek(p,dt,tx,ty,1.0,2); return;
  }
  const ty=ownY+(ball.y-ownY)*0.55;
  const tx=W*lane*0.7+ball.x*0.3;
  seek(p,dt,tx,Math.max(34,Math.min(H-34,ty)),mul);
}

/* ---------- update ---------- */
function nearestTo(team, x, y, exclude){
  let best=null,bd=1e9;
  for(const p of players){
    if(p.team!==team||(Array.isArray(exclude)?exclude.includes(p):p===exclude)) continue;
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=p;}
  }
  return best;
}
function update(dt){
  st.msgT-=dt; st.menuT+=dt; st.toastT-=dt;
  if(st.mode==='splash'&&st.menuT>1.7){ afterSplash(); return; }
  if(st.mode!=='play') return;
  if(net.on&&net.role==='host'&&(st.hold>0||st.freeze>0)){ net.seen.pc=net.in.pc; net.seen.tc=net.in.tc; net.seen.sh=net.in.sh; }
  if(st.hold>0){ st.hold-=dt; return; }
  if(st.freeze>0){ st.freeze-=dt; ballStep(dt,false); if(st.freeze<=0){ if(st.tut) finishTut(false); else resetKick(st.kick); } return; }
  if(!st.tut){ st.t-=dt; if(st.t<=0){ st.t=0; endGame(); return; } }
  st.sw=Math.max(0,st.sw-dt); st.kickProt=Math.max(0,st.kickProt-dt);
  st.fire[0]=Math.max(0,st.fire[0]-dt); st.fire[1]=Math.max(0,st.fire[1]-dt);

  for(const p of players){
    p.stun=Math.max(0,p.stun-dt); p.cd=Math.max(0,p.cd-dt); p.tcd=Math.max(0,p.tcd-dt);
    p.dash=Math.max(0,p.dash-dt); p.inv=Math.max(0,p.inv-dt);
    p.lunge=Math.max(0,p.lunge-dt); p.tr=Math.max(0,p.tr-dt);
  }

  const online=net.on&&net.role==='host';
  if(online){
    netHostInputs(); st.sw1=Math.max(0,st.sw1-dt);
    if(net.in.sh&&ball.owner===cur1) st.charge1=Math.min(1,st.charge1+dt/0.65); else st.charge1=0;
  }
  if(inp.shootHeld&&ball.owner===cur) st.charge=Math.min(1,st.charge+dt/0.65);
  else if(!inp.shootHeld||ball.owner!==cur) st.charge=0;

  if(!ball.owner&&st.sw<=0){
    const n=nearestTo(0,ball.x,ball.y,null);
    if(n&&n!==cur){
      const dc=Math.hypot(cur.x-ball.x,cur.y-ball.y), dn=Math.hypot(n.x-ball.x,n.y-ball.y);
      if(dc-dn>30){cur=n; st.sw=0.5;}
    }
  }
  if(online&&!ball.owner&&st.sw1<=0){
    const n=nearestTo(1,ball.x,ball.y,null);
    if(n&&n!==cur1){
      const dc=Math.hypot(cur1.x-ball.x,cur1.y-ball.y), dn=Math.hypot(n.x-ball.x,n.y-ball.y);
      if(dc-dn>30){cur1=n; st.sw1=0.5;}
    }
  }

  let mx=0,my=0;
  if(inp.joy){ mx=inp.joy.mx; my=inp.joy.my; }
  else {
    const k=inp.keys;
    mx=(k.arrowright||k.d?1:0)-(k.arrowleft||k.a?1:0);
    my=(k.arrowdown||k.s?1:0)-(k.arrowup||k.w?1:0);
    const m=Math.hypot(mx,my); if(m>1){mx/=m;my/=m;}
  }

  for(const p of players) p.isGuard=false;
  for(const team of [0,1]){
    const ctl=team===0?cur:(online?cur1:null);
    let g=st.gk[team];
    if(!g||g.team!==team||g===ctl||g===ball.owner){
      const gy=team===0?H:0; g=null; let gd=1e9;
      for(const p of players){
        if(p.team!==team||p===ctl||p===ball.owner) continue;
        const d=Math.abs(p.y-gy);
        if(d<gd){gd=d;g=p;}
      }
      st.gk[team]=g;
    }
    if(g) g.isGuard=true;
  }
  const bx=ball.owner?ball.owner.x:ball.x, by=ball.owner?ball.owner.y:ball.y;
  const guards=players.filter(q=>q.isGuard);
  const ch0=ball.owner&&ball.owner.team===0?null:nearestTo(0,bx,by,[cur,...guards]);
  const ch1=ball.owner&&ball.owner.team===1?null:nearestTo(1,bx,by,online?[cur1,...guards]:guards);
  for(const p of players){
    if(p===cur) move(p,dt,mx,my,1.0);
    else if(online&&p===cur1) move(p,dt,-net.in.mx,-net.in.my,1.0);
    else if(st.tut){ p.vx=0; p.vy=0; }
    else ai(p,dt,p.team===0?ch0:ch1,p.team===0?0.97:T.spd);
  }
  if(st.tut) tutProgress();

  const o=ball.owner;
  if(o&&o.dash>0){
    for(const q of players){
      if(q.team===o.team||q.stun>0||q.isGuard) continue;
      if(Math.hypot(q.x-o.x,q.y-o.y)<34){
        q.stun=0.7; addMeter(o.team,0.22); if(o.team===0) st.stats.nut++; evt('n',o.team);
        if(o.team===0&&st.fire[0]<=0) pop('NUTMEG!','#ffc83d',0.9);
        sfx(700,0.1,'triangle',0.05);
      }
    }
  }

  separate();
  tryTackle();

  if(!ball.owner){
    let best=null,bd=1e9;
    const sp=Math.hypot(ball.vx,ball.vy);
    if(sp<760){
      for(const p of players){
        if(p.cd>0||p.stun>0) continue;
        const d=Math.hypot(p.x-ball.x,p.y-ball.y);
        const reach=p.isGuard?PR+BR+(p.lunge>0?27:17):PR+BR+4;
        const maxSp=p.isGuard?(ball.hot?640:800):520;
        if(sp<maxSp&&d<reach&&d<bd){bd=d;best=p;}
      }
      if(best){
        ball.owner=best; ball.last=best.team; ball.vx=ball.vy=0; ball.hot=false;
        if(best.team===0) cur=best; else if(online) cur1=best; else if(best.isGuard) best.pass=0.5;
        if(best.isGuard&&sp>300){ pop('SAVED!',best.team===0?C.me:C.cpu,0.9); sfx(150,0.12,'sawtooth',0.06); evt('s',best.team); }
      }
    }
  }
  ballStep(dt,true);
}

/* ---------- drawing ---------- */
function txt(s,x,y,size,color,font=BODY,weight='800',align='center',base='middle'){
  ctx.font=`${weight} ${size}px ${font}`;
  ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline=base;

}
function fitTxt(s,x,y,size,maxW,color,font=BODY,weight='800',align='center'){
  ctx.font=`${weight} ${size}px ${font}`; const w=ctx.measureText(s).width;
  if(w>maxW) size=Math.max(9,Math.floor(size*maxW/w));

}
function drawPitch(){
  ctx.fillStyle=C.fence; ctx.fillRect(-M,-M,W+2*M,H+2*M);

  ctx.stroke(); ctx.restore();

  if(myTeam()===1){ ctx.translate(W/2,H/2+4); ctx.rotate(Math.PI); txt('CAGE BALL',0,0,58,'#fff',DISPLAY,'400'); }
  else txt('CAGE BALL',W/2,H/2+4,58,'#fff',DISPLAY,'400');
  ctx.restore();

  ctx.strokeStyle=C.chalk; ctx.globalAlpha=0.85; ctx.lineWidth=2;

  ctx.beginPath(); ctx.arc(W/2,H/2,44,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,3,0,Math.PI*2); ctx.fillStyle=C.chalk; ctx.fill();
  const bw=GW+46, bd=64;
  ctx.strokeRect(W/2-bw/2,0,bw,bd);

  ctx.globalAlpha=1;

  for(const top of [true,false]){
    const y0=top?-M+2:H, h=M-2;

    ctx.strokeStyle='#5b6679'; ctx.lineWidth=1; ctx.beginPath();

    for(let j=0;j<=h;j+=8){ ctx.moveTo(W/2-GW/2,y0+j); ctx.lineTo(W/2+GW/2,y0+j); }
    ctx.stroke();
    ctx.fillStyle='#fff';
    for(const px of [W/2-GW/2,W/2+GW/2]){ ctx.beginPath(); ctx.arc(px,top?0:H,3.5,0,Math.PI*2); ctx.fill(); }
  }

function drawPlayer(p){

    }

    const f=0.5+0.5*Math.sin(performance.now()/70+p.id);

  }

    if(st.charge>0){
      ctx.strokeStyle='#fff'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,PR+9,-Math.PI/2,-Math.PI/2+Math.PI*2*st.charge); ctx.stroke();

}
function drawBall(){
  if(ball.hot){
    const sp=Math.hypot(ball.vx,ball.vy)||1;
    for(let i=1;i<=5;i++){
      ctx.globalAlpha=0.5/i; ctx.fillStyle=i<3?'#ffb03a':'#ff5a2a';
      ctx.beginPath(); ctx.arc(ball.x-ball.vx/sp*i*7,ball.y-ball.vy/sp*i*7,BR*(1-i*0.1),0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,vw,vh);
  if(!ball){ overlay(); return; }
  ctx.save();
  const shk=st.shake>0.3?st.shake:0;
  ctx.translate(ox+(Math.random()-0.5)*shk,oy+(Math.random()-0.5)*shk); ctx.scale(sc,sc);
  const sorted=[...players].sort((a,b)=>a.y-b.y);
  ctx.save();
  if(myTeam()===1){ ctx.translate(W/2,H/2); ctx.rotate(Math.PI); ctx.translate(-W/2,-H/2); }
  drawPitch();
  ctx.restore();
  ctx.save();
  if(myTeam()===1){ ctx.translate(W/2,H/2); ctx.rotate(Math.PI); ctx.translate(-W/2,-H/2); }
  drawTutWorld();
  for(const p of sorted) drawPlayer(p);
  drawBall();
  drawAssist();
  ctx.restore();
  if(st.msgT>0&&st.mode==='play'){
    ctx.globalAlpha=Math.min(1,st.msgT*2.5);
    let size=st.msgBig?54:30; ctx.font='400 '+size+'px '+DISPLAY; const mw=ctx.measureText(st.msg).width; if(mw>W-30) size=Math.floor(size*(W-30)/mw);
    ctx.lineWidth=6; ctx.strokeStyle=C.ink; ctx.lineJoin='round';
    ctx.font=`400 ${size}px ${DISPLAY}`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeText(st.msg,W/2,H/2-34); ctx.fillStyle=st.msgC; ctx.fillText(st.msg,W/2,H/2-34);
    ctx.globalAlpha=1;
  }
  ctx.restore();
  if((!st.tut||st.mode!=='play')&&st.mode!=='menu'&&st.mode!=='tiers'&&st.mode!=='settings'&&st.mode!=='lobby'&&st.mode!=='online') drawHUD();
  if(st.mode==='play') drawControls();
  else overlay();
  if(st.tut&&st.mode==='play') drawTutUI();
  if(st.toastT>0){
    ctx.globalAlpha=Math.min(1,st.toastT*3);
    ctx.font='800 17px '+BODY; const tw2=ctx.measureText(st.toast).width+36;
    rr(vw/2-tw2/2,vh-132,tw2,38,19); ctx.fillStyle='rgba(239,233,218,0.95)'; ctx.fill();
    txt(st.toast,vw/2,vh-113,17,C.ink,BODY,'800');
    ctx.globalAlpha=1;
  }
}

const conn={ok:null,err:''};
async function sb(path,opts){
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const to=setTimeout(()=>{ try{ ctl&&ctl.abort(); }catch(e){} },9000);
  let r;
  try{
    r=await fetch(SB_URL+path,Object.assign({headers:{'apikey':SB_KEY,'Content-Type':'application/json'},signal:ctl?ctl.signal:undefined},opts||{}));
  }catch(e){ clearTimeout(to); conn.ok=false; conn.err='NO CONNECTION'; throw e; }
  clearTimeout(to);
  if(!r.ok){ conn.ok=false; conn.err='ERROR '+r.status; throw new Error('http '+r.status); }
  conn.ok=true; conn.err='';
  const t=await r.text(); return t?JSON.parse(t):null;
}
const rpc=(fn,args)=>sb('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(args)});

let flushing=false;
async function flushPend(){
  if(flushing) return; flushing=true;
  while(pend.length){
    try{ await rpc('submit_result',pend[0]); pend.shift(); savePend(); }
    catch(e){ if(conn.err==='ERROR 400'){ pend.shift(); savePend(); continue; } break; }
  }
  flushing=false;
}

function track(name,tier,meta){
  try{
    const once=ONCE.indexOf(name)>=0;
    if(once&&evSent.indexOf(name)>=0) return;
    if(!prog.dev) return;
    rpc('track',{p_device:prog.dev,p_name:name,p_tier:tier==null?null:tier|0,p_meta:meta==null?null:Math.round(meta)}).then(()=>{
      if(once){ evSent.push(name); try{ localStorage.setItem('cageball.ev',JSON.stringify(evSent)); }catch(e){} }
    }).catch(()=>{});
  }catch(e){}
}

}

function netMsg(m){

function guestStep(dt){
  st.msgT-=dt; st.menuT+=dt; st.toastT-=dt;

  const age=Math.min(0.2,(performance.now()-net.snapAt)/1000), k=1-Math.exp(-dt*24);
  const o=sn.b[4]>=0?players[sn.b[4]]:null;
  ball.owner=o; ball.hot=!!sn.b[5];
  let mx=0,my=0;
  if(inp.joy){ mx=inp.joy.mx; my=inp.joy.my; }
  else { const kk=inp.keys; mx=(kk.arrowright||kk.d?1:0)-(kk.arrowleft||kk.a?1:0); my=(kk.arrowdown||kk.s?1:0)-(kk.arrowup||kk.w?1:0); const mm=Math.hypot(mx,my); if(mm>1){ mx/=mm; my/=mm; } }
  net.in.mx=Math.round(mx*100)/100; net.in.my=Math.round(my*100)/100; net.in.sh=inp.shootHeld?1:0;
  const ci=sn.c[1], moving=Math.hypot(mx,my)>0.15;

    const tx=a[0]+a[4]*age, ty=a[1]+a[5]*age;
    d.stun=a[6]; d.dash=a[7]?0.2:0; d.lunge=a[8]?0.2:0; d.tr=a[9]?0.5:0;
    if(i===ci&&d.ok&&!d.dash&&!d.lunge&&!d.stun&&Math.hypot(tx-d.x,ty-d.y)<90){
      /* my own player moves at once on this phone; the host's position only pulls it back when we drift apart */
      move(d,dt,-net.in.mx,-net.in.my,1.0);
      const err=Math.hypot(tx-d.x,ty-d.y), kc=moving?(err>45?1-Math.exp(-dt*3):0):1-Math.exp(-dt*8);
      d.x+=(tx-d.x)*kc; d.y+=(ty-d.y)*kc;
      return;
    }
    if(!d.ok||Math.hypot(tx-d.x,ty-d.y)>70){ d.x=tx; d.y=ty; d.ok=1; } else { d.x+=(tx-d.x)*k; d.y+=(ty-d.y)*k; }
    d.fx=a[2]; d.fy=a[3]; d.vx=a[4]; d.vy=a[5];
  });

    ball.vx=sn.b[2]; ball.vy=sn.b[3]; ball.rot+=Math.hypot(ball.vx,ball.vy)*dt*0.1;
  }

}

cv.addEventListener('lostpointercapture',up);
window.addEventListener('touchend',e=>{ if(!e.touches||e.touches.length===0) clearTouches(); },{passive:true});
window.addEventListener('touchcancel',e=>{ if(!e.touches||e.touches.length===0) clearTouches(); },{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearTouches(); });
window.addEventListener('pagehide',clearTouches);
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='nick'){ if(e.key==='Enter') commitNick(); return; }
  const k=e.key.toLowerCase();
  if(e.repeat) return;
  audioOn();
  if(st.mode==='splash'){ if(st.menuT>0.25) afterSplash(); return; }
  if(st.mode==='lobby'){ if(k==='escape'&&st.menuT>0.3&&net.state!=='ready') leaveLobby(); return; }
  if(st.mode==='online'){ if(k==='escape'&&st.menuT>0.3){ st.mode='menu'; st.menuT=0; } return; }
  if(st.mode==='over'&&st.onlRes){ if((k===' '||k==='enter'||k==='escape')&&st.menuT>0.6) leaveLobby(); return; }
  if(st.tut&&k==='escape'){ finishTut(true); return; }
  if(st.mode==='how'){ if(st.menuT>0.3) closeHow(); return; }
  if(st.mode==='board'){ if((k===' '||k==='enter'||k==='escape')&&st.menuT>0.3){ st.mode='menu'; st.menuT=0; } return; }
  if(st.mode==='chal'){ if(st.menuT>0.3){ if(k===' '||k==='enter') acceptChal(); else if(k==='escape') skipChal(); } return; }
  if(st.mode==='records'){ if((k===' '||k==='enter'||k==='escape')&&st.menuT>0.3){ st.mode='menu'; st.menuT=0; } return; }
  if(st.mode==='over'){ if(k==='s') makeCard(); if((k===' '||k==='enter')&&st.menuT>0.6){ st.mode='tiers'; st.menuT=0; } return; }
  if(st.mode==='menu'||st.mode==='tiers'||st.mode==='settings'){
    if(st.menuT<=0.3) return;
    if(k==='escape'&&st.mode!=='menu'){ st.mode='menu'; st.menuT=0; return; }
    if(st.mode==='menu'&&(k===' '||k==='enter')){ st.mode='tiers'; st.menuT=0; return; }
    const n=parseInt(k,10)-1; if(st.mode!=='settings'&&n>=0&&n<TIERS.length&&n<=prog.unlocked) startGame(n);
    return;
  }
  inp.keys[k]=true;
  if(k==='j'||k===' '){ inp.shootHeld=true; e.preventDefault(); }
  if(k==='k') doPass();
  if(k==='l') doTrick();
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  inp.keys[k]=false;
  if((k==='j'||k===' ')&&inp.shootHeld){ inp.shootHeld=false; releaseShoot(); }
});
window.addEventListener('blur',()=>{ inp.keys={}; inp.shootHeld=false; st.charge=0; });

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const real=Math.min(0.033,(now-last)/1000); last=now;
  let ts=(st.mode==='play'&&st.tier===0&&!st.tut&&!net.on)?0.92:1;
  if(st.stop>0){ st.stop-=real; ts=0; }
  else if(st.freeze>1.3) ts=0.4;
  st.shake*=0.86;
  netTick(real);
  if(net.on&&net.role==='guest') guestStep(real); else update(real*ts);
  draw();
  requestAnimationFrame(frame);
}
resetKick(0); st.mode='splash'; st.menuT=0; st.hold=0; st.msgT=0;
flushPend();
track('session'); track('first_open');
try{ const rc=new URLSearchParams(location.search).get('r'); if(rc&&/^[A-Za-z2-9]{5}$/.test(rc)) joinCode=rc.toUpperCase(); }catch(e){}
resize();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
